---
name: Run Bot

on:
  schedule:
    - cron: '13 * * * *'  # Every hour
  workflow_dispatch:  # Allows triggering manually from the UI
  push:
    branches: ["main"]


jobs:
  accordproject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Accord Project PR Triage Bot
        uses: ./
        with:
          organization: 'accordproject'
          project-number: '29'
          gh-app-id: '2856902'
          gh-app-installation-id: '109864494'
          gh-app-private-key: ${{ secrets.PR_BOT_APP_PRIVATE_KEY }}
